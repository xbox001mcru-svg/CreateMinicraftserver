
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimurHost</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
h1{color:#62eaff;text-align:center}
.panel{max-width:450px;margin:25px auto;background:#1d2b40;padding:20px;border-radius:16px}
input,select,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;border:0;border-radius:8px;font-size:16px}
button{background:#13b981;color:white;font-weight:bold}
.note{color:#ffd166;font-size:13px}
.server{background:#263b53;padding:12px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>
<h1>⚡ TimurHost</h1>
<div class="panel">
<h2>Создать Bedrock-сервер</h2>
<label>Название сервера</label>
<input id="serverName" placeholder="Например Timur SMP">
<label>Версия Minecraft</label>
<select id="version">
<option>26.33</option>
<option>26.40</option>
<option>26.60</option>
<option>1.21.130</option>
<option>1.21.91.25</option>
</select>
<label>Тип сервера</label>
<select id="engine">
<option>PocketMine-MP</option>
<option>Bedrock Dedicated Server</option>
</select>
<button onclick="createServer()">Создать сервер</button>
<p class="note">Демонстрационная панель. Настоящий запуск требует подключения хостинга.</p>
<div id="result"></div>
</div>
<script>
function createServer(){
let name=document.getElementById('serverName').value.trim();
let version=document.getElementById('version').value;
let engine=document.getElementById('engine').value;
if(!name){alert('Введи название сервера!');return;}
document.getElementById('result').innerHTML=
'<div class="server"><h3>'+name+'</h3>'+
'Версия: '+version+'<br>Движок: '+engine+
'<p>Статус: Ожидает подключения хостинга</p></div>';
}
</script>
</body>
  </html>
