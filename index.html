<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreateServer Host</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;padding:16px}
h1{text-align:center;color:#62eaff}
.box{max-width:500px;margin:20px auto;background:#1d2b40;padding:18px;border-radius:14px}
input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:16px}
button{background:#13b981;color:white;font-weight:bold}
.stop{background:#e74c3c}
.delete{background:#7952b3}
.server{background:#263b53;padding:12px;border-radius:10px;margin-top:12px;overflow-wrap:anywhere}
small{color:#ffd166}
</style>
</head>
<body>
<h1>⚡ CreateServer Host</h1>

<div class="box">
<h2>Создать сервер</h2>

<label>Название сервера</label>
<input id="name" placeholder="Например Timur SMP">

<label>Версия Minecraft</label>
<select id="version">
<option>26.33</option>
<option>26.40</option>
<option>26.60</option>
<option>1.21.130</option>
<option>1.21.91.25</option>
</select>

<label>Тип сервера</label>
<select id="engine">
<option>PocketMine-MP</option>
<option>Bedrock Dedicated Server</option>
</select>

<button onclick="createServer()">＋ Создать сервер</button>
<p id="message"></p>
</div>

<div class="box">
<h2>Мои серверы</h2>
<div id="servers">Серверов пока нет.</div>
</div>

<script>
let servers = [];

function saveServers(){
  try {
    localStorage.setItem("createServerHost", JSON.stringify(servers));
  } catch(e) {}
}

function loadServers(){
  try {
    servers = JSON.parse(localStorage.getItem("createServerHost") || "[]");
  } catch(e) {
    servers = [];
  }
  renderServers();
}

function createServer(){
  const name = document.getElementById("name").value.trim();
  const version = document.getElementById("version").value;
  const engine = document.getElementById("engine").value;
  const message = document.getElementById("message");

  if(!name){
    message.textContent = "Сначала введи название сервера!";
    return;
  }

  servers.push({
    id: Date.now(),
    name: name,
    version: version,
    engine: engine,
    status: "Остановлен"
  });

  saveServers();
  renderServers();
  document.getElementById("name").value = "";
  message.textContent = "Сервер добавлен в панель!";
}

function startServer(id){
  const server = servers.find(s => s.id === id);
  if(!server) return;
  server.status = "Запущен (демо)";
  saveServers();
  renderServers();
}

function stopServer(id){
  const server = servers.find(s => s.id === id);
  if(!server) return;
  server.status = "Остановлен";
  saveServers();
  renderServers();
}

function deleteServer(id){
  if(!confirm("Удалить сервер из панели?")) return;
  servers = servers.filter(s => s.id !== id);
  saveServers();
  renderServers();
}

function renderServers(){
  const box = document.getElementById("servers");

  if(servers.length === 0){
    box.textContent = "Серверов пока нет.";
    return;
  }

  box.replaceChildren();

  servers.forEach(s => {
    const card = document.createElement("div");
    card.className = "server";

    const title = document.createElement("h3");
    title.textContent = s.name;

    const info = document.createElement("p");
    info.textContent = "Версия: " + s.version +
      " | Движок: " + s.engine;

    const status = document.createElement("p");
    status.textContent = "Статус: " + s.status;

    const start = document.createElement("button");
    start.textContent = "▶ Запустить";
    start.onclick = () => startServer(s.id);

    const stop = document.createElement("button");
    stop.className = "stop";
    stop.textContent = "■ Остановить";
    stop.onclick = () => stopServer(s.id);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "✖ Удалить";
    del.onclick = () => deleteServer(s.id);

    card.append(title, info, status, start, stop, del);
    box.appendChild(card);
  });
}

loadServers();
</script>
</body>
</html>
